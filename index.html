<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片取色器</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f8f6ff, #eeeaff);
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .home-teleport {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 50;
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      padding: 0 14px;
      border: 1px solid #c7bdf0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #3730a3;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(73, 56, 150, 0.14);
      backdrop-filter: blur(8px);
    }

    .home-teleport:hover,
    .home-teleport:focus-visible {
      background: #eef2ff;
      outline: none;
    }

    .app {
      width: 100%;
      max-width: 1000px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .desc {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 14px;
    }

    .upload-box {
      border: 2px dashed #d1d5db;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      background: #f9fafb;
    }

    input[type="file"] {
      margin-top: 12px;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: stretch;
    }

    .canvas-wrap {
      width: 100%;
      min-height: 360px;
      border-radius: 16px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      display: none;
      cursor: crosshair;
      max-width: 100%;
      max-height: 100%;
    }

    .empty {
      color: #9ca3af;
      font-size: 14px;
      padding: 40px;
      text-align: center;
    }

    .panel {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      background: #fafafa;
      height: 100%;
    }

    .color-preview {
      width: 100%;
      height: 140px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      background: #000000;
      margin-bottom: 18px;
    }

    .row {
      margin-bottom: 14px;
    }

    .label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .value-line {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .value {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      overflow-x: auto;
      white-space: nowrap;
    }

    button {
      border: none;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #374151;
    }

    .tip {
      margin-top: 16px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    .locked {
      margin-top: 12px;
      padding: 10px 12px;
      background: #eef2ff;
      color: #3730a3;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    @media (max-width: 800px) {
      .main {
        grid-template-columns: 1fr;
      }

      .panel {
        order: -1;
      }
    }
  </style>
</head>
<body style="margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;">
  <a class="home-teleport" href="https://andycr0w.github.io/">← AndyCrow Home</a>
  <div class="app">
    <h1>图片取色器</h1>
    <p class="desc">上传图片后，将鼠标移动到图片上即可实时获取颜色；点击图片可以锁定当前颜色。</p>

    <div class="upload-box">
      <strong>上传图片</strong>
      <br />
      <input id="imageInput" type="file" accept="image/*" />
    </div>

    <div class="main">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="empty" id="emptyText">    请先上传一张图片</div>
        <canvas id="canvas"></canvas>
      </div>

      <div class="panel">
        <div class="color-preview" id="colorPreview"></div>

        <div class="row">
          <div class="label">16 进制 HEX</div>
          <div class="value-line">
            <div class="value" id="hexValue">#000000</div>
            <button data-copy="hexValue">复制</button>
          </div>
        </div>

        <div class="row">
          <div class="label">8 进制 RGB</div>
          <div class="value-line">
            <div class="value" id="octValue">octal(000, 000, 000)</div>
            <button data-copy="octValue">复制</button>
          </div>
        </div>

        <div class="row">
          <div class="label">普通 RGB</div>
          <div class="value-line">
            <div class="value" id="rgbValue">rgb(0, 0, 0)</div>
            <button data-copy="rgbValue">复制</button>
          </div>
        </div>

        <div class="row">
          <div class="label">鼠标位置</div>
          <div class="value" id="posValue">x: 0, y: 0</div>
        </div>

        <div class="locked" id="lockedText">  已锁定当前颜色   (双击取消锁定)  </div>

        <div class="tip">
          说明：8 进制颜色格式使用 RGB 三个通道分别转换，例如
          <br />
          <code>rgb(255,128,64)</code> → <code>octal(377,200,100)</code>
        </div>
      </div>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const canvas = document.getElementById("canvas");
    const canvasWrap = document.getElementById("canvasWrap");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const emptyText = document.getElementById("emptyText");
    const colorPreview = document.getElementById("colorPreview");
    const hexValue = document.getElementById("hexValue");
    const octValue = document.getElementById("octValue");
    const rgbValue = document.getElementById("rgbValue");
    const posValue = document.getElementById("posValue");
    const lockedText = document.getElementById("lockedText");

    let imageLoaded = false;
    let isLocked = false;

    function fitCanvasToWrap() {
      if (!imageLoaded || !canvas.width || !canvas.height) return;

      const style = window.getComputedStyle(canvasWrap);
      const horizontalPadding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      const verticalPadding = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
      const availableWidth = canvasWrap.clientWidth - horizontalPadding;
      const availableHeight = canvasWrap.clientHeight - verticalPadding;

      if (availableWidth <= 0 || availableHeight <= 0) return;

      const scale = Math.min(availableWidth / canvas.width, availableHeight / canvas.height);
      canvas.style.width = `${Math.max(1, Math.floor(canvas.width * scale))}px`;
      canvas.style.height = `${Math.max(1, Math.floor(canvas.height * scale))}px`;
    }

    if ("ResizeObserver" in window) {
      new ResizeObserver(fitCanvasToWrap).observe(canvasWrap);
    } else {
      window.addEventListener("resize", fitCanvasToWrap);
    }

    imageInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {
        const img = new Image();

        img.onload = function () {
          const maxWidth = 900;
          const scale = img.width > maxWidth ? maxWidth / img.width : 1;

          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          emptyText.style.display = "none";
          canvas.style.display = "block";
          imageLoaded = true;
          isLocked = false;
          lockedText.style.display = "none";
          requestAnimationFrame(fitCanvasToWrap);
        };

        img.src = event.target.result;
      };

      reader.readAsDataURL(file);
    });

    canvas.addEventListener("mousemove", function (event) {
      if (!imageLoaded || isLocked) return;

      const point = getCanvasPoint(event);
      updateColor(point.x, point.y);
    });

    canvas.addEventListener("click", function (event) {
      if (!imageLoaded) return;

      const point = getCanvasPoint(event);
      updateColor(point.x, point.y);

      isLocked = true;
      lockedText.style.display = "block";
    });

    canvas.addEventListener("mouseleave", function () {
      if (!isLocked) {
        posValue.textContent = "鼠标不在图片上";
      }
    });

    canvas.addEventListener("dblclick", function () {
      isLocked = false;
      lockedText.style.display = "none";
    });

    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();

      const x = Math.floor((event.clientX - rect.left) * (canvas.width / rect.width));
      const y = Math.floor((event.clientY - rect.top) * (canvas.height / rect.height));

      return { x, y };
    }

    function updateColor(x, y) {
      if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;

      const pixel = ctx.getImageData(x, y, 1, 1).data;

      const r = pixel[0];
      const g = pixel[1];
      const b = pixel[2];

      const hex = rgbToHex(r, g, b);
      const octal = rgbToOctal(r, g, b);
      const rgb = `rgb(${r}, ${g}, ${b})`;

      colorPreview.style.backgroundColor = hex;
      hexValue.textContent = hex;
      octValue.textContent = octal;
      rgbValue.textContent = rgb;
      posValue.textContent = `x: ${x}, y: ${y}`;
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b]
        .map(value => value.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function rgbToOctal(r, g, b) {
      return "octal(" + [r, g, b]
        .map(value => value.toString(8).padStart(3, "0"))
        .join(", ") + ")";
    }

    document.querySelectorAll("button[data-copy]").forEach(button => {
      button.addEventListener("click", async function () {
        const targetId = this.getAttribute("data-copy");
        const text = document.getElementById(targetId).textContent;

        try {
          await navigator.clipboard.writeText(text);

          const oldText = this.textContent;
          this.textContent = "已复制";

          setTimeout(() => {
            this.textContent = oldText;
          }, 1000);
        } catch (error) {
          alert("复制失败，请手动复制：" + text);
        }
      });
    });
  </script>
</body>
</html>
